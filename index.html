<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pausenreservierung Saalbau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: links Tischplan + aktueller Tisch darunter, rechts Produktauswahl mit Kategorie-Reitern. Am Handy alles untereinander. */
:root{
  --bg:#f3f1f0; --surface:#ffffff; --sunk:#ebe7e6; --ink:#1f1a1b; --muted:#6e6566; --line:#ddd6d5;
  --accent:#c0202d; --accent-soft:#f8e3e4; --on-accent:#ffffff;
  --hot:#a8590c; --hot-soft:#fbeedd; --paper:#fbfaf9;
  --f-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0808; --surface:#151112; --sunk:#201a1b; --ink:#ffffff; --muted:#cbc1c2; --line:#4b3e40;
  --accent:#e8202e; --accent-soft:#4a1016; --on-accent:#ffffff; --hot:#ffb066; --hot-soft:#3b2510; --paper:#110d0e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0808; --surface:#151112; --sunk:#201a1b; --ink:#ffffff; --muted:#cbc1c2; --line:#4b3e40;
  --accent:#e8202e; --accent-soft:#4a1016; --on-accent:#ffffff; --hot:#ffb066; --hot-soft:#3b2510; --paper:#110d0e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:12px 48px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:38px;flex:none}
.brand h1{font-family:var(--f-ui);font-weight:700;font-size:22px;margin:0;line-height:1.1}
.brand small{display:block;font-family:var(--f-ui);font-weight:500;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.event{flex:1 1 260px;display:flex;gap:8px;min-width:0}
.event input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:#2f9a5a}
nav.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:var(--r);padding:4px;margin-bottom:14px}
nav.tabs button{flex:1;border:0;background:transparent;padding:12px 6px;border-radius:7px;font-family:var(--f-ui);font-weight:600;font-size:18px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
nav.tabs .badge{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:var(--accent);color:var(--on-accent);font-size:13px;line-height:20px}

.summary{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px;font-family:var(--f-ui)}
.summary .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block}
.summary .v{font-size:24px;font-weight:700}
.floorbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 20px;font-family:var(--f-ui);font-weight:600;font-size:17px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-family:var(--f-ui);font-weight:600;font-size:16px}
.ghost.danger{color:var(--accent)}
.ghost:disabled{opacity:.45;cursor:not-allowed}
.btn-solid{border:0;border-radius:8px;padding:10px 16px;font-family:var(--f-ui);font-weight:700;font-size:16px;background:var(--accent);color:var(--on-accent)}
.spacer{flex:1}
.hint{font-size:14px;color:var(--muted);margin:0}

.main{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media (min-width:980px){.main{grid-template-columns:minmax(0,1fr) 440px}}
.planwrap{overflow-x:auto;border-radius:var(--r)}
.plan{position:relative;width:100%;aspect-ratio:16/10;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:manipulation}
@media (max-width:680px){.plan{min-width:640px}}
.plan.editing{background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px;touch-action:pan-y pinch-zoom}
.editing .tbl,.editing .lm{touch-action:none}
@media (max-width:680px){
  .plan.editing{min-width:0}
  .editing .tbl{width:clamp(24px,7.6%,66px)}
  .editing .tbl.sq{width:clamp(22px,5.8%,52px)}
  .editing .tbl.rect{width:clamp(30px,10%,88px)}
  .editing .tbl .n{font-size:12px}
  .editing .lm{font-size:8px;letter-spacing:.04em}
  .editing .lm .rs{width:22px;height:22px;right:-9px;bottom:-9px}
}
.stage-label{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bar{position:absolute;border:1.5px dashed var(--muted);border-radius:6px;display:grid;place-items:center;font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.editing .lm{pointer-events:auto;cursor:grab;outline:1px dashed var(--muted);outline-offset:1px}
.lm.lsel{outline:2px solid var(--accent)}
.lm .rs{position:absolute;right:-6px;bottom:-6px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:nwse-resize}
.editbar{flex-direction:column;align-items:stretch}
.eb-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eb-sel{padding-bottom:8px;border-bottom:1px solid var(--line)}
.editbar select{padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
.editbar #lmtext{width:160px}
.tnum{display:inline-flex;align-items:center;gap:8px}
.editbar #tblnum{width:74px;font-family:var(--f-ui);font-weight:700;font-size:20px;text-align:center;padding:6px 8px;border:2px solid var(--accent);border-radius:7px;background:var(--bg);color:var(--ink)}
.ltag{display:inline-block;font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 7px;margin-right:4px;vertical-align:2px;background:var(--hot-soft);color:var(--hot)}
.lm{position:absolute;display:grid;place-items:center;pointer-events:none;font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.1;overflow:hidden}
.lm-theke{background:var(--ink);color:var(--bg);border-radius:6px;font-weight:700;font-size:13px}
.lm-zone{pointer-events:auto;display:flex;gap:3px;padding:3px}
.tz{flex:1;align-self:stretch;border:0;border-radius:4px;background:rgba(255,255,255,.12);color:inherit;font:inherit;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;min-height:40px}
.tz.has{background:var(--accent);color:var(--on-accent)}
.tz:hover{background:var(--accent);color:var(--on-accent)}
.tz small{font-size:10px;letter-spacing:.02em;text-transform:none;font-weight:600;opacity:.9}
.zlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;max-height:46vh;overflow:auto}
.zitem{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit;cursor:pointer}
.zitem b{font-family:var(--f-ui);font-size:22px;color:var(--accent)}
.zitem small{color:var(--muted)}
.zitem.done{border-color:var(--ink);background:var(--sunk)}
.zitem.done b{color:var(--ink)}
.lm-bench{background:#e9cf3a;opacity:.85;border-radius:3px;color:#5b4b00;font-size:9px}
.lm-yellow{background:#f3dc4a;opacity:.28;border-radius:4px}
.lm-stairs{background:repeating-linear-gradient(0deg,var(--line) 0 2px,transparent 2px 7px);border:1px solid var(--line);border-radius:3px}
.lm-stairs span,.lm-sitz span{background:var(--paper);padding:1px 4px;border-radius:3px}
.lm-sitz{background:repeating-linear-gradient(90deg,#f3dc4a 0 6px,#e2c62e 6px 12px);opacity:.75;border-radius:3px;color:#4a3d00;writing-mode:vertical-rl}
.lm-sitz span{background:transparent}
.lm-pillar{background:var(--muted);border-radius:50%;opacity:.6}
.lm-wall{background:var(--line);border-radius:2px;font-size:9px}
.lm-rail{background:var(--muted);opacity:.7;border-radius:2px}
.lm-void{background:repeating-linear-gradient(45deg,transparent 0 8px,var(--line) 8px 9px);border-radius:4px}
.lm-label{font-size:10px}
.tbl .ch{position:absolute;width:34%;height:14%;background:var(--muted);border-radius:3px;opacity:.75}
.tbl .ch1{top:-22%;left:33%}.tbl .ch2{bottom:-22%;left:33%}.tbl .ch3{left:-22%;top:43%;width:14%;height:34%;transform:translateY(-25%)}.tbl .ch4{right:-22%;top:43%;width:14%;height:34%;transform:translateY(-25%)}
.tbl{position:absolute;transform:translate(-50%,-50%);width:clamp(40px,7.6%,66px);aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1;user-select:none;-webkit-user-select:none}
.tbl.rect{border-radius:6px;width:clamp(48px,10%,88px);aspect-ratio:1.6}
.tbl.sq{border-radius:6px;width:clamp(34px,5.8%,52px)}
.tbl .n{font-family:var(--f-ui);font-weight:700;font-size:clamp(15px,2.2vw,22px)}
.tbl .s{white-space:nowrap;font-family:var(--f-ui);font-size:clamp(10px,1.3vw,14px);font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tbl.res{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tbl.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.assignbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding:10px 14px;margin-bottom:10px;border-radius:var(--r);border:1.5px solid var(--accent);background:var(--accent-soft);font-size:16px;scroll-margin-top:12px}
.assignbar.go{background:var(--accent);color:var(--on-accent)}
.plan.assigning .tbl.free{border-color:var(--accent);border-width:3px}
@media (prefers-reduced-motion:no-preference){.plan.assigning .tbl.free{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 6px var(--accent-soft)}}
.tbl.sel{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--ink)}
.tbl.linked.res{background:var(--accent-soft);color:var(--accent);border-style:solid}
.tbl.linked.done{background:var(--surface);color:var(--ink);border-width:3px}
.plan.grouping .tbl.free{border-color:var(--accent);border-width:3px}
.plan.grouping .tbl.linked.gsel{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--accent)}
.grprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.grprow .gl{font-size:15px}
.grprow .gl b{font-family:var(--f-ui);font-size:18px}
.holdbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.holdinfo{padding:14px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:15px;text-align:center}
.editing .tbl{cursor:grab;border-style:dashed}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--ink);background:var(--surface)}
.legend i.r{background:var(--accent);border-color:var(--accent)}
.legend i.s{border-style:dashed;border-radius:3px}
.legend i.d{background:var(--ink);border-color:var(--ink)}
.donepill{font-family:var(--f-ui);font-size:14px;font-weight:700;padding:3px 10px;border-radius:14px;background:var(--ink);color:var(--bg)}
.bigbtn{padding:14px 26px;font-size:19px;min-width:140px}
.btn-solid:disabled{opacity:.4;cursor:not-allowed}
.editbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.editbar input{width:76px;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}

/* Aktueller Tisch (unter dem Plan) */
.order{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:12px}
.o-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.o-head h2{margin:0;font-family:var(--f-ui);font-size:30px;font-weight:700}
.o-head .floor{font-family:var(--f-ui);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.o-head .x{margin-left:auto;border:0;background:var(--sunk);width:44px;height:44px;border-radius:50%;font-size:24px;line-height:1}
.o-body{padding:14px 16px;display:grid;gap:14px}
.fields{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:720px){.fields{grid-template-columns:1fr 1.4fr}}
.field label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-family:var(--f-ui);font-weight:600}
.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:17px}
.field textarea{resize:vertical;min-height:46px;line-height:1.35}
.lines{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .nm{min-width:0;font-size:17px}
.line .nm small{color:var(--muted);display:block;font-size:13px}
.line .sum{font-family:var(--f-ui);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:44px;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:9px;font-size:24px;line-height:1}
.stepper span{min-width:30px;text-align:center;font-family:var(--f-ui);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.empty-lines{padding:16px;color:var(--muted);font-size:15px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.glassline{font-size:15px;color:var(--muted);line-height:1.4}
.glassline b{color:var(--ink);font-weight:600}
.o-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.total{display:flex;align-items:baseline;gap:12px;font-family:var(--f-ui);margin-left:auto}
.total span{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.total b{font-size:38px;font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:6px;font-size:15px}
.linkbtn.danger{color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px solid var(--accent);border-radius:8px;background:var(--accent-soft)}
.confirm p{margin:0;flex:1 1 200px;font-size:15px}

/* Produktauswahl */
.picker{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.picker h3{margin:0;font-family:var(--f-ui);font-size:20px}
.picker .for{font-family:var(--f-ui);color:var(--muted);font-size:15px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1.5px solid var(--line);background:var(--bg);border-radius:22px;padding:9px 14px;font-family:var(--f-ui);font-weight:600;font-size:16px;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cats button[aria-pressed="true"] .c{background:var(--on-accent);color:var(--accent)}
.cats button .c{display:inline-block;margin-left:6px;min-width:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;line-height:18px;padding:0 5px;text-align:center}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.prod.hasic{flex-direction:row;align-items:center;gap:10px;padding:10px 10px 10px 6px}
.prod .pic{flex:none;width:34px;height:46px;display:grid;place-items:center;background:#fff;border-radius:8px}
.prod .pic svg{width:30px;height:40px}
.nw{white-space:nowrap}
.prod .ptx{display:flex;flex-direction:column;gap:4px;min-width:0}
.prod{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px;position:relative}
.prod:active{transform:scale(.98)}
.prod.on{border-color:var(--accent);background:var(--accent-soft)}
.prod .pn{font-size:18px;font-weight:600;line-height:1.2;padding-right:30px}
.prod .pp{font-family:var(--f-ui);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.prod .q{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--on-accent);font-family:var(--f-ui);font-weight:700;font-size:16px;border-radius:14px;min-width:28px;padding:0 7px;line-height:26px;text-align:center}
.picker.off .prods,.picker.off .cats{opacity:.4;pointer-events:none}
#addbox{display:grid}
.addtoggle{border-style:dashed;padding:12px}
.addform{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.addform h4{margin:0;font-family:var(--f-ui);font-size:17px}
.af-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.af-wide{grid-column:1/-1}
.field select{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.af-btns{display:flex;gap:8px;justify-content:flex-end}
.af-list{display:grid;gap:4px;margin-top:4px}
.af-row{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:15px;border-bottom:1px solid var(--line);padding:4px 0}
.af-row .sz{color:var(--muted)}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;width:20px;height:20px;color:var(--muted);pointer-events:none}
.search input{width:100%;padding:13px 44px 13px 42px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:17px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--accent);outline:none}
.search button{position:absolute;right:6px;width:34px;height:34px;border:0;border-radius:50%;background:var(--sunk);font-size:20px;line-height:1}
.sres{font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.themebtn{display:inline-flex;align-items:center;gap:6px}
.themebtn svg{width:16px;height:16px}
.picknote{padding:12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:15px;text-align:center}

/* Packliste & Kasse */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sheet-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.block{margin-top:22px}
.block:first-child,.cols>.block{margin-top:0}
.block h3{font-family:var(--f-ui);font-size:20px;margin:0 0 2px}

function nextSpot(z){let m=0;zoneSpots(z).forEach(k=>{m=Math.max(m,spotOf(k.slice(1)).num)});return "th-"+z+"-"+(m+1)}
const numOf=k=>{const t=tblById(k.slice(1));return t?t.n:(+k.slice(1)||0)};
const sortKey=k=>{const sp=spotOf(k.slice(1));return sp?100000+ZORDER.indexOf(sp.z)*1000+sp.num:(+numOf(k)||0)};
const byNum=(a,b)=>sortKey(a)-sortKey(b)||(a<b?-1:a>b?1:0);
const selNum=()=>{const t=tblById(S.sel);return t?t.n:S.sel};
const placeName=k=>(spotOf(k.slice(1))?"":"Tisch ")+lbl(k);
const selName=()=>placeName(tid(S.sel));
function deckText(keys){const t=keys.filter(k=>!spotOf(k.slice(1)));const out=[];if(t.length)out.push("Tisch "+t.map(lbl).join(", "));
  ZORDER.forEach(z=>{const n=keys.map(k=>spotOf(k.slice(1))).filter(sp=>sp&&sp.z===z).map(sp=>sp.num);if(n.length)out.push(ZONES[z].name+" "+n.join(", "))});return out.join("; ")}
function resOf(n){return S.res[tid(n)]}
function total(r){if(!r||!r.items)return 0;let s=0;for(const k in r.items){if(P[k])s+=P[k].price*r.items[k]}return Math.round(s*100)/100}
function count(r){if(!r||!r.items)return 0;let c=0;for(const k in r.items)c+=r.items[k];return c}
function isEmpty(r){return !r||(count(r)===0&&!(r.name||"").trim()&&!(r.note||"").trim()&&!r.hold&&!(r.group&&r.group.length))}
/* Gruppen: Haupttisch hat r.group = [ids der dazugestellten Tische] */
function linkMap(){const m={};for(const k in S.res){const r=S.res[k];if(isEmpty(r)||!r.group)continue;r.group.forEach(g=>{if(tblById(g))m[g]=k})}return m}
function grpIds(k){const r=S.res[k];return [k.slice(1)].concat((r&&r.group||[]).filter(g=>tblById(g)))}
function lbl(k){const r=S.res[k];const g=(r&&r.group||[]).map(id=>tblById(id)).filter(Boolean).map(t=>t.n);return [numOf(k)].concat(g).join(" + ")}
function floorOf(id){const t=tblById(id);return t?t.f:"unten"}
function glassesOf(r){const g={};let bottles=[];if(!r||!r.items)return {g,bottles};
  for(const k in r.items){const p=P[k];if(!p||!p.glass)continue;
    if(p.perBottle){bottles.push(p)}else g[p.glass]=(g[p.glass]||0)+r.items[k]}
  return {g,bottles}}
function glassText(r){const {g,bottles}=glassesOf(r);
  const parts=GLASS_ORDER.filter(t=>g[t]).map(t=>`${g[t]} ${g[t]===1?GLASS[t][0]:GLASS[t][1]}`);
  bottles.forEach(p=>parts.push(`${GLASS[p.glass][1]} für ${p.name} Flasche (nach Gästen)`));
  return parts}
const nmSz=p=>p.size&&!p.name.includes(p.size)?p.name+" "+p.size:p.name;
const isWine=p=>p.cat==="wein"&&!p.crate&&p.when==="kalt";
/* Wie viel Wein/Sekt man zum Einschenken mitnehmen muss (Flasche = 0,75 l) */
function pourText(qty){const g={};for(const k in qty){const p=P[k];const m=/(\d+),(\d+)\s*l/.exec(p.size||p.name);if(!m)continue;const l=parseFloat(m[1]+"."+m[2])*qty[k];
  const base=p.name.replace(/\s*\d+,\d+\s*l$/,"");g[base]=(g[base]||0)+l}
  return Object.keys(g).map(b=>{const l=Math.round(g[b]*100)/100;const fl=Math.ceil(l/0.75-1e-9);return `${b}: ${String(l).replace(".",",")} l, also ${fl} ${fl===1?"Flasche":"Flaschen"}`})}
function itemsText(r,filter){return ORDER.filter(k=>r.items&&r.items[k]>0&&(!filter||filter(P[k]))).map(k=>`${r.items[k]}× ${P[k].name}`)}

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

function saveRes(id){
  if(mode!=="db"){lsSave();return}
  dirty.add(id);clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>{timers[id]=null;
    chains[id]=(chains[id]||Promise.resolve()).then(async()=>{
      const r=S.res[id];
      try{ if(isEmpty(r)) await db.doc("res/"+id).delete(); else await db.doc("res/"+id).set(clone(r)); }
      catch(e){toast("Speichern hat nicht geklappt. Bitte Verbindung prüfen.")}
      finally{ if(!timers[id]) dirty.delete(id) }
    });
  },300);
}
async function saveDoc(path,data){

/* ---------- Packliste ---------- */
function floorKeys(f){return Object.keys(S.res).filter(k=>!isEmpty(S.res[k])&&floorOf(k.slice(1))===f).sort(byNum)}
function packData(f){
  const keys=floorKeys(f);const tot={};const glass={};let bottleNotes=[];
  keys.forEach(k=>{const r=S.res[k];const it=r.items||{};for(const p in it)tot[p]=(tot[p]||0)+it[p];
    const {g,bottles}=glassesOf(r);for(const t in g)glass[t]=(glass[t]||0)+g[t];bottles.forEach(b=>bottleNotes.push(`Tisch ${numOf(k)}: ${GLASS[b.glass][1]} für ${b.name} Flasche`))});
  const crate=ORDER.filter(k=>tot[k]&&P[k].crate);
  const other=ORDER.filter(k=>tot[k]&&!P[k].crate&&P[k].when==="kalt");
  const later=keys.filter(k=>itemsText(S.res[k],p=>p.when!=="kalt").length);
  const wine=keys.filter(k=>itemsText(S.res[k],isWine).length);
  return {keys,tot,glass,bottleNotes,crate,other,later,wine};
}
function listRows(keys,tot){return `<table class="list"><tbody>${keys.map(k=>`<tr><td class="qty">${tot[k]}×</td><td>${esc(P[k].name)}${P[k].size?` <span class="sz">${esc(P[k].size)}</span>`:""}</td></tr>`).join("")}</tbody></table>`}
function totalsData(){
  const u=packData("unten").tot,o=packData("oben").tot;

const LOGO=`<svg viewBox="0 0 34 38" aria-hidden="true"><path d="M17 1 33 13V37H1V13Z" fill="#c0202d"/><text x="17" y="24" text-anchor="middle" font-family="Barlow Semi Condensed,Arial" font-weight="600" font-size="10" fill="#fff">CA</text><text x="17" y="34" text-anchor="middle" font-family="Barlow Semi Condensed,Arial" font-weight="600" font-size="10" fill="#fff">SA</text></svg>`;
function buildCards(){
  const keys=Object.keys(S.res).filter(k=>!isEmpty(S.res[k])).sort(byNum);
  if(!keys.length){$("printout").innerHTML="<p>Noch keine Reservierungen.</p>";return}
  const ev=S.event.name?esc(S.event.name):"Catering Saalbau Witten";
  const today=new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
  const evLine=/\d{1,2}\.\d{1,2}\./.test(S.event.name||"")?ev:`${ev}, ${today}`;
  const card=k=>{const r=S.res[k];const L=lbl(k);
    const cold=ORDER.filter(p=>r.items&&r.items[p]>0);const gl=glassText(r);
    const cls=cold.length>10?"c-items cols dense":cold.length>5?"c-items cols":"c-items";
    return `<div class="card"><div class="c-top">${LOGO}<div class="c-brand"><b>Pausenreservierung</b><span>${evLine}</span></div>${(()=>{const sp=spotOf(k.slice(1));const sm=sp?ZONES[sp.z].card:"TISCH";const v=sp?String(sp.num):L;return `<div class="c-tn"><small>${sm}</small><strong${v.length>3?' class="long"':""}>${esc(v)}</strong></div>`})()}</div>
      ${r.name?`<div class="c-name">${esc(r.name)}</div>`:""}
      ${cold.length?`<ul class="${cls}">${cold.map(p=>`<li><b>${r.items[p]}×</b> ${esc(P[p].name)}${P[p].size&&!/^Flasche/.test(P[p].size)?"":P[p].size?` <span class="sz">${esc(P[p].size)}</span>`:""}</li>`).join("")}</ul>`:""}
      ${!cold.length?`<div class="c-hold">Reserviert</div>`:""}
      ${r.note?`<div class="c-note">${esc(r.note)}</div>`:""}
      ${gl.length?`<div class="c-gl">Gläser: ${esc(gl.join(", "))}</div>`:""}</div>`};
  let h="";for(let i=0;i<keys.length;i+=8){h+=`<section class="cardpage">${keys.slice(i,i+8).map(card).join("")}</section>`}
  $("printout").innerHTML=h;
}

/* ---------- Abrechnung: Kassenbericht, Kassenbestand 1 und 2 ---------- */
/* KB_MAP: Zellenkarte der Excel-Vorlage (aus build_tpl.py), KB_TPL: Vorlage als Base64 */
const DENOMS=[{v:200,k:"n"},{v:100,k:"n"},{v:50,k:"n"},{v:20,k:"n"},{v:10,k:"n"},{v:5,k:"n"},{v:2,k:"c"},{v:1,k:"c"},{v:0.5,k:"c"},{v:0.2,k:"c"},{v:0.1,k:"c"}];
const NOTE_COL={200:"#e7c34a",100:"#5fa86a",50:"#e88a3a",20:"#4f7fc9",10:"#d2555a",5:"#9aa0a6"};
const ID2ROW={};KB_MAP.sections.forEach((sec,si)=>sec.rows.forEach(r=>{r.sec=si;r.ids.forEach(id=>ID2ROW[id]=r.key)}));
const CAT2SEC={};KB_MAP.sections.forEach((sec,si)=>sec.cats.forEach(c=>CAT2SEC[c]=si));
function newAbr(){return {date:"",card1:"",card2:"",invoice:"",cnt:{},log:[],start:500,target:500,kb1:{time:"",n:{}},kb2:{time:"",n:{},manual:false},sub:"bericht"}}
S.abr=newAbr();
const dkey=v=>String(v);
const isoToday=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function roundHalf(d){d=d||new Date();let m=Math.round((d.getHours()*60+d.getMinutes())/30)*30;m%=1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
const deDate=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");return m?`${m[3]}.${m[2]}.${m[1]}`:""};
const pnum=v=>{let s=String(v==null?"":v).replace(/\s|€/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?n:0};
const eurIn=v=>v===""||v==null?"":String(v);

/* Zeilen im Tool: feste Zeilen der Vorlage plus eigene Produkte */
function abrRows(){
  const secs=KB_MAP.sections.map((s,si)=>({title:s.title,rows:s.rows.map(r=>{const p=r.ids.length&&P[r.ids[0]];return {key:r.key,name:r.name,price:p?p.price:r.price,row:r.row,sec:si}})}));
  (S.custom||[]).forEach(c=>{const p=P[c.id];if(!p)return;const si=CAT2SEC[p.cat];if(si==null)return;secs[si].rows.push({key:"c:"+c.id,name:p.name,price:p.price,custom:c.id,sec:si})});
  return secs;
}
/* Kühlhaus-Ware aus der Pausenreservierung */
const WINE01={weiss01:"weiss",rot01:"rot"};
function pauseCounts(){const out={};const w01={};for(const k in S.res){const r=S.res[k];if(isEmpty(r))continue;const it=r.items||{};
  for(const id in it){const p=P[id];if(!p||!(it[id]>0))continue;if(WINE01[id]){w01[id]=(w01[id]||0)+it[id];continue}if(!p.crate)continue;const key=p.custom?"c:"+id:ID2ROW[id];if(key)out[key]=(out[key]||0)+it[id]}}
  /* 0,1-l-Wein: am Ende als normales Glas mitgezählt, 2× 0,1 l = 1× 0,2 l, abgerundet */
  for(const id in w01){const n=w01[id];const k=ID2ROW[WINE01[id]];if(k){out[k]=(out[k]||0)-Math.ceil(n/2);out["w01:"+k]=n}}
  return out}
function abrTotals(){const pc=pauseCounts();let sum=0;const secs=abrRows().map(s=>{let ss=0;s.rows.forEach(r=>{r.man=S.abr.cnt[r.key]||0;r.auto=pc[r.key]||0;r.w01=pc["w01:"+r.key]||0;if(r.w01)r.auto=-Math.min(-r.auto,r.man);r.tot=r.man+r.auto;ss+=r.tot*r.price});sum+=ss;s.sum=ss;return s});
  const card=pnum(S.abr.card1)+pnum(S.abr.card2)+pnum(S.abr.card),inv=pnum(S.abr.invoice);return {secs,sum,card,inv,bar:sum-card-inv}}
function kbSum(n){return DENOMS.reduce((a,d)=>a+(+n[dkey(d.v)]||0)*Math.round(d.v*100),0)/100}

/* Vorschlag für Kassenbestand 2: genau auf das Ziel, Münzen und 5er/10er bleiben drin, sonst lieber kleine Scheine */
function kb2Proposal(){
  const have=S.abr.kb1.n;const T=Math.round(pnum(S.abr.target)*10);
  const items=DENOMS.map(d=>({v:Math.round(d.v*10),n:Math.max(0,Math.floor(+have[dkey(d.v)]||0)),w:d.k==="c"?1e6:d.v<=10?1e3:({20:3,50:2,100:1,200:0})[d.v]}));
  const NEG=-1e18;let dp=new Float64Array(T+1).fill(NEG);dp[0]=0;const choice=[];
  items.forEach(it=>{const nd=new Float64Array(T+1).fill(NEG);const ch=new Int32Array(T+1);
    for(let s=0;s<=T;s++){if(dp[s]===NEG)continue;for(let c=0;c<=it.n;c++){const t=s+c*it.v;if(t>T)break;const sc=dp[s]+c*it.w;if(sc>nd[t]){nd[t]=sc;ch[t]=c}}}
    choice.push(ch);dp=nd});
  let best=-1;for(let s=T;s>=0;s--)if(dp[s]!==NEG){best=s;break}
  const keep={};let s=best;for(let i=items.length-1;i>=0;i--){const c=choice[i][s];keep[dkey(DENOMS[i].v)]=c;s-=c*items[i].v}
  return {keep,reached:best/10,exact:best===T};
}
function kb2Counts(){return S.abr.kb2.manual?S.abr.kb2.n:kb2Proposal().keep}

let abrT=null;
function saveAbr(){if(mode!=="db"){lsSave();return}clearTimeout(abrT);abrT=setTimeout(async()=>{await saveDoc("config/abr",S.abr);abrT=null},500)}
function ensureDate(){if(!S.abr.date){S.abr.date=isoToday()}}

/* --- Darstellung --- */
function denomSvg(d){
  if(d.k==="n"){const c=NOTE_COL[d.v];return `<svg viewBox="0 0 120 64" aria-hidden="true"><rect x="1" y="1" width="118" height="62" rx="6" fill="${c}"/><rect x="1" y="1" width="118" height="62" rx="6" fill="none" stroke="rgba(0,0,0,.25)"/><circle cx="92" cy="32" r="20" fill="rgba(255,255,255,.28)"/><rect x="10" y="44" width="46" height="6" rx="3" fill="rgba(255,255,255,.35)"/><text x="12" y="34" font-family="Barlow Semi Condensed,Arial" font-weight="700" font-size="28" fill="#fff">${d.v}</text><text x="92" y="39" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#fff">€</text></svg>`}
  const big=d.v>=1;const r=d.v===2?30:d.v===1?27:d.v===0.5?29:d.v===0.2?26:23;
  const lbl=d.v>=1?String(d.v):String(Math.round(d.v*100));
  const outer=d.v===2?"#c9ccd1":d.v===1?"#d6ae45":"#cf9f3c",inner=d.v===2?"#d6ae45":d.v===1?"#c9ccd1":"#cf9f3c";
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="${outer}" stroke="rgba(0,0,0,.28)"/>${big?`<circle cx="32" cy="32" r="${r-8}" fill="${inner}"/>`:`<circle cx="32" cy="32" r="${r-4}" fill="none" stroke="rgba(0,0,0,.15)"/>`}<text x="32" y="${big?39:37}" text-anchor="middle" font-family="Barlow Semi Condensed,Arial" font-weight="700" font-size="${big?20:16}" fill="#3a2a0a">${lbl}${big?"":""}</text>${big?"":`<text x="32" y="48" text-anchor="middle" font-family="Arial" font-size="8" fill="#3a2a0a">CENT</text>`}</svg>`;
}
const dName=d=>d.v>=1?`${d.v} €`:`${Math.round(d.v*100)} Cent`;
function cashGrid(which,n,editable){
  return `<div class="cgrid">${DENOMS.map(d=>{const c=+n[dkey(d.v)]||0;return `<div class="cash ${d.k==="n"?"note":"coin"}" data-d="${d.v}">
    <div class="cimg">${denomSvg(d)}</div><div class="cinfo"><b>${dName(d)}</b><small class="num" data-csum>${c?eur(c*d.v):"&nbsp;"}</small></div>
    ${editable?`<div class="cstep"><button class="ghost" data-cdec aria-label="${dName(d)} weniger">−</button><input class="num" inputmode="numeric" data-cin="${which}" value="${c||""}" placeholder="0" aria-label="Anzahl ${dName(d)}"><button class="ghost" data-cinc aria-label="${dName(d)} mehr">+</button></div>`:`<div class="cfix num">${c}×</div>`}</div>`}).join("")}</div>`;
}
function renderAbr(){
  ensureDate();const a=S.abr;const sub=a.sub||"bericht";
  ["bericht","kb1","kb2"].forEach(x=>{const b=$("ab-"+x);if(b)b.setAttribute("aria-pressed",sub===x)});
  const t=abrTotals();let h="";
  if(sub==="bericht"){
    h+=`<div class="abr-meta"><label><span>Veranstaltung</span><input value="${esc(S.event.name||"")}" placeholder="Oben bei Veranstaltung eintragen" disabled></label><label><span>Datum</span><input type="date" id="abr-date" value="${esc(a.date)}"></label></div>
    <div class="kpis abr-kpis abr-money"><div class="kpi"><span>Gesamtumsatz</span><b class="num" id="abr-sum">${eur(t.sum)}</b></div>

const XNS="http://schemas.openxmlformats.org/spreadsheetml/2006/main";
function colNum(c){let n=0;for(const ch of c)n=n*26+ch.charCodeAt(0)-64;return n}
function splitRef(r){const m=/^([A-Z]+)(\d+)$/.exec(r);return [m[1],+m[2]]}
function xSheet(xml){
  const doc=new DOMParser().parseFromString(xml,"application/xml");const cells={};
  Array.from(doc.getElementsByTagNameNS(XNS,"c")).forEach(c=>cells[c.getAttribute("r")]=c);
  const get=r=>{if(cells[r])return cells[r];const [col,row]=splitRef(r);
    let rowEl=Array.from(doc.getElementsByTagNameNS(XNS,"row")).find(x=>+x.getAttribute("r")===row);
    if(!rowEl){rowEl=doc.createElementNS(XNS,"row");rowEl.setAttribute("r",row);const sd=doc.getElementsByTagNameNS(XNS,"sheetData")[0];
      const after=Array.from(sd.children).find(x=>+x.getAttribute("r")>row);sd.insertBefore(rowEl,after||null)}
    const c=doc.createElementNS(XNS,"c");c.setAttribute("r",r);const after=Array.from(rowEl.children).find(x=>colNum(splitRef(x.getAttribute("r"))[0])>colNum(col));rowEl.insertBefore(c,after||null);cells[r]=c;return c};
  const clear=c=>{Array.from(c.childNodes).forEach(n=>{if(n.localName!=="f")c.removeChild(n)})};
  return {doc,cells,
    num(r,v){const c=get(r);clear(c);c.setAttribute("t","n");if(v===null||v===undefined||v==="")return;const ve=doc.createElementNS(XNS,"v");ve.textContent=String(v);c.appendChild(ve)},
    str(r,s){const c=get(r);clear(c);if(!s){c.removeAttribute("t");return}c.setAttribute("t","inlineStr");const is=doc.createElementNS(XNS,"is"),te=doc.createElementNS(XNS,"t");te.textContent=s;is.appendChild(te);c.appendChild(is)},
    calc(){/* Formelergebnisse mitschreiben, damit Vorschauen ohne Neuberechnung stimmen */
      const memo={};const val=r=>{if(r in memo)return memo[r];memo[r]=0;const c=cells[r];if(!c)return 0;const f=c.getElementsByTagNameNS(XNS,"f")[0];
        if(!f){const v=c.getElementsByTagNameNS(XNS,"v")[0];const t=c.getAttribute("t");return memo[r]=(v&&(!t||t==="n")?(+v.textContent||0):0)}
        let ex=f.textContent.replace(/SUM\(([A-Z]+)(\d+):([A-Z]+)(\d+)\)/g,(m,c1,r1,c2,r2)=>{let s=0;for(let cc=colNum(c1);cc<=colNum(c2);cc++)for(let rr=+r1;rr<=+r2;rr++){let L="",x=cc;while(x){L=String.fromCharCode(65+(x-1)%26)+L;x=Math.floor((x-1)/26)}s+=val(L+rr)}return "("+s+")"});
        ex=ex.replace(/\b([A-Z]+\d+)\b/g,(m,ref)=>"("+val(ref)+")");
        if(!/^[\d.()+\-*\s/e]+$/.test(ex))return memo[r]=0;
        let res=0;try{res=Function("return ("+ex+")")()}catch(err){res=0}res=Math.round(res*1e6)/1e6;memo[r]=res;
        let ve=c.getElementsByTagNameNS(XNS,"v")[0];if(!ve){ve=doc.createElementNS(XNS,"v");c.appendChild(ve)}ve.textContent=String(res);c.setAttribute("t","n");return res};
      Object.keys(cells).forEach(val)},
    xml(){return new XMLSerializer().serializeToString(doc)}};
}
const xDate=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");if(!m)return null;return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(1899,11,30))/864e5)};
const xTime=hm=>{const m=/^(\d{1,2}):(\d{2})/.exec(hm||"");return m?((+m[1])*60+(+m[2]))/1440:null};
async function buildXlsx(){
  ensureDate();const a=S.abr;const t=abrTotals();
  const zip=await JSZip.loadAsync(KB_TPL,{base64:true});
  const s1=xSheet(await zip.file(KB_MAP.sheet).async("string"));
  s1.str(KB_MAP.event,S.event.name||"");s1.num(KB_MAP.date,xDate(a.date));
  s1.num(KB_MAP.card,(a.card1===""&&a.card2===""&&!a.card)?"":t.card);s1.num(KB_MAP.invoice,a.invoice===""?"":pnum(a.invoice));
  let over=0;
  t.secs.forEach((s,si)=>{const free=KB_MAP.sections[si].free.slice();
    s.rows.forEach(r=>{let row=r.row;
      if(r.custom){if(!r.tot)return;row=free.shift();if(!row){over++;return}s1.str("B"+row,r.name)}
      s1.num("C"+row,r.price);s1.num("D"+row,r.man||"");s1.num("E"+row,r.auto||"")})});
  s1.calc();zip.file(KB_MAP.sheet,s1.xml());
  const kbn=[a.kb1.n,kb2Counts()];const times=[a.kb1.time,a.kb2.time];
  for(let i=0;i<2;i++){const m=KB_MAP.kb[i];const sx=xSheet(await zip.file(m.sheet).async("string"));
    sx.str(m.event,S.event.name||"");sx.num(m.date,xDate(a.date));sx.num(m.time,xTime(times[i]||(i===0&&!kbSum(a.kb1.n)?"":roundHalf())));
    DENOMS.forEach(d=>{const v=+kbn[i][dkey(d.v)]||0;sx.num(m.counts[dkey(d.v)],v||"")});
    sx.calc();zip.file(m.sheet,sx.xml())}
  const blob=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",compression:"DEFLATE"});
  return {blob,over};
}
function xlsxName(){const ev=(S.event.name||"").replace(/[^\wäöüÄÖÜß.\- ]+/g,"").trim().replace(/\s+/g,"_");return `Kassenbericht_${deDate(S.abr.date)||deDate(isoToday())}${ev?"_"+ev:""}.xlsx`}
async function downloadXlsx(){
  const btn=$("abr-dl");btn.disabled=true;const old=btn.textContent;btn.textContent="Wird erstellt…";
  try{

    else{const u=URL.createObjectURL(blob);const l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Kassenbericht heruntergeladen")}

}

  else if(l)sel=`<div class="eb-row eb-sel"><b>${esc((LM_TYPES.find(x=>x[0]===l.t)||[0,"Element"])[1])}</b><input id="lmtext" value="${esc(l.l||"")}" placeholder="Beschriftung" aria-label="Beschriftung"><span class="hint">Roten Punkt unten rechts ziehen = Größe ändern</span><button class="ghost danger" data-ea="dellm">Entfernen</button></div>`;
  else sel=`<div class="eb-row eb-sel"><span class="hint">Tisch oder Element (Theke, Treppe usw.) antippen und ziehen. Was du antippst, kannst du hier bearbeiten.</span></div>`;
  eb.innerHTML=`${sel}
   <div class="eb-row"><input id="newnum" inputmode="numeric" placeholder="Nr." aria-label="Tischnummer">
     <select id="newkind" aria-label="Tischart"><option value="hoch">Stehtisch rund</option><option value="sitz">Sitzplatz mit Stühlen</option><option value="eckig">Stehtisch eckig</option></select>
     <button class="ghost" data-ea="addtbl">Tisch hinzufügen</button></div>
   <div class="eb-row"><select id="newlm" aria-label="Element">${LM_TYPES.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")}</select>
     <button class="ghost" data-ea="addlm">Element hinzufügen</button></div>
   <div class="eb-row"><button class="ghost" data-ea="copy">Plan kopieren</button><button class="ghost" data-ea="reset">Standardplan</button><span class="spacer"></span><button class="btn-solid" data-ea="done">Fertig</button></div>`;
}
$("editbar").addEventListener("click",e=>{
  const b=e.target.closest("[data-ea]");if(!b)return;const a=b.dataset.ea;
  const t=S.editSel!=null?tblById(S.editSel):null;
  if(a==="chairs"&&t){if(t.c)delete t.c;else{t.c=1;delete t.s}renderPlan();return}
  if(a==="shape"&&t){if(t.s)delete t.s;else{t.s="sq";delete t.c}renderPlan();return}
  if(a==="deltbl"&&t){const lk=linkMap()[t.id];if(lk){toast("Tisch "+t.n+" gehört zur Gruppe von Tisch "+numOf(lk)+". Erst dort rausnehmen.");return}if(!isEmpty(resOf(t.id))){toast("Tisch "+t.n+" hat eine Reservierung. Erst die Reservierung löschen.");return}S.layout.tables=S.layout.tables.filter(x=>x!==t);S.editSel=null;renderPlan();return}
  if(a==="dellm"&&S.lmSel!=null){lmList().splice(S.lmSel,1);S.lmSel=null;renderPlan();return}
  if(a==="addtbl"){const v=parseInt($("newnum").value,10);if(!(v>0)){toast("Bitte erst eine Tischnummer eingeben.");return}
    const dup=S.layout.tables.some(x=>x.n===v);
    const k=$("newkind").value;const nt={id:"x"+Date.now().toString(36),n:v,f:S.floor,x:50,y:50};if(k==="sitz")nt.c=1;if(k==="eckig")nt.s="sq";
    S.layout.tables.push(nt);S.editSel=nt.id;if(dup)toast("Nummer "+v+" gibt es jetzt doppelt.");S.lmSel=null;renderPlan();return}
  if(a==="addlm"){const d=LM_TYPES.find(x=>x[0]===$("newlm").value);const L=lmList();L.push({t:d[0],x:50-d[3]/2,y:50-d[4]/2,w:d[3],h:d[4],l:d[2]});S.lmSel=L.length-1;S.editSel=null;renderPlan();return}
  if(a==="copy"){const txt=JSON.stringify(S.layout);const ok=()=>toast("Plan kopiert. Einfach im Chat einfügen.");
    try{navigator.clipboard.writeText(txt).then(ok,()=>showCopy(txt))}catch(err){showCopy(txt)}return}
  if(a==="reset"){S.layout=normLayout(clone(DEFAULT_LAYOUT));S.editSel=null;S.lmSel=null;renderAll();toast("Standardplan geladen. Mit „Fertig“ speichern.");return}
  if(a==="done"){S.editing=false;S.editSel=null;S.lmSel=null;saveDoc("config/layout",S.layout);renderAll();toast("Plan gespeichert");return}
});
function dupHint(t){const o=S.layout.tables.filter(x=>x!==t&&x.n===t.n);return o.length?`Die ${t.n} gibt es jetzt doppelt${o.some(x=>x.f!==t.f)?" (auch "+(o.find(x=>x.f!==t.f).f)+")":""}. Das ist okay.`:""}
$("editbar").addEventListener("input",e=>{
  if(e.target.id==="tblnum"&&S.editSel!=null){const t=tblById(S.editSel);const v=parseInt(e.target.value,10);if(!t||!(v>0))return;t.n=v;
    const el=document.querySelector(`.tbl[data-id="${CSS.escape(t.id)}"] .n`);if(el)el.textContent=v;$("tblnumhint").textContent=dupHint(t);return}
  if(e.target.id==="lmtext"&&S.lmSel!=null){lmList()[S.lmSel].l=e.target.value;const el=document.querySelector(`.lm[data-i="${S.lmSel}"] span`);if(el)el.textContent=e.target.value;else renderPlan()}});
function showCopy(txt){const eb=$("editbar");let ta=$("copyta");if(!ta){ta=document.createElement("textarea");ta.id="copyta";ta.rows=3;ta.style.width="100%";eb.appendChild(ta)}ta.value=txt;ta.focus();ta.select();toast("Text markiert. Bitte kopieren und im Chat einfügen.")}


let drag=null;
$("plan").addEventListener("pointerdown",e=>{
  if(!S.editing)return;const rect=$("plan").getBoundingClientRect();
  const rs=e.target.closest("[data-rs]");const lm=e.target.closest(".lm");const b=e.target.closest(".tbl");
  if(b){const id=b.dataset.id;e.preventDefault();if(S.editSel!==id){S.editSel=id;S.lmSel=null;renderPlan()}const el=document.querySelector(`.tbl[data-id="${CSS.escape(id)}"]`);drag={id,rect,el,sx:e.clientX,sy:e.clientY,moved:false};$("plan").setPointerCapture(e.pointerId);return}
  if(lm){const i=+lm.dataset.i;const l=lmList()[i];e.preventDefault();S.lmSel=i;S.editSel=null;renderPlan();
    drag={lm:i,rs:!!rs,rect,sx:e.clientX,sy:e.clientY,ox:l.x,oy:l.y,ow:l.w,oh:l.h};$("plan").setPointerCapture(e.pointerId);return}
  S.editSel=null;S.lmSel=null;renderPlan();
});
$("plan").addEventListener("pointermove",e=>{
  if(!drag)return;const {rect}=drag;
  if(drag.lm!=null){const l=lmList()[drag.lm];const dx=(e.clientX-drag.sx)/rect.width*100,dy=(e.clientY-drag.sy)/rect.height*100;
    if(drag.rs){l.w=Math.max(1.5,Math.round((drag.ow+dx)*10)/10);l.h=Math.max(1.5,Math.round((drag.oh+dy)*10)/10)}
    else{l.x=Math.round(Math.min(100-l.w,Math.max(0,drag.ox+dx))*10)/10;l.y=Math.round(Math.min(100-l.h,Math.max(0,drag.oy+dy))*10)/10}
    const el=document.querySelector(`.lm[data-i="${drag.lm}"]`);if(el){el.style.left=l.x+"%";el.style.top=l.y+"%";el.style.width=l.w+"%";el.style.height=l.h+"%"}return}
  const x=Math.min(97,Math.max(3,(e.clientX-rect.left)/rect.width*100));const y=Math.min(95,Math.max(5,(e.clientY-rect.top)/rect.height*100));
  if(!drag.moved){if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<6)return;drag.moved=true}
  const t=tblById(drag.id);t.x=Math.round(x*10)/10;t.y=Math.round(y*10)/10;
  drag.el.style.left=t.x+"%";drag.el.style.top=t.y+"%";
});
const endDrag=()=>{drag=null};
$("plan").addEventListener("pointerup",endDrag);$("plan").addEventListener("pointercancel",endDrag);
$("plan").addEventListener("click",e=>{
  const zb=e.target.closest(".tz");if(zb&&!S.editing){openZone(zb.dataset.zone);return}
  const b=e.target.closest(".tbl");if(!b||S.editing)return;
  const id=b.dataset.id;
  if(S.grouping&&S.sel!=null&&!isD()){toggleGroup(id);return}
  const LM=linkMap();const n=LM[id]?LM[id].slice(1):id;
  if(isD()&&S.draft&&!isEmpty(S.draft)){assignDraft(n);return}
  S.grouping=false;S.sel=S.sel===n?null:n;S.confirmClear=false;renderAll();
  if(S.sel!=null&&window.matchMedia("(max-width:979px)").matches){$("order").scrollIntoView({behavior:"smooth",block:"start"})}
});

function toggleGroup(id){
  if(id===S.sel)return;const t=tblById(id);if(!t)return;
  const cur=getCur();const grp=(cur&&cur.group||[]).slice();const i=grp.indexOf(id);
  if(i>=0)grp.splice(i,1);
  else{const lk=linkMap()[id];
    if(lk&&lk!==tid(S.sel)){toast("Tisch "+t.n+" gehört schon zur Gruppe von Tisch "+numOf(lk)+".");return}
    if(!isEmpty(resOf(id))){toast("Tisch "+t.n+" hat schon eine eigene Reservierung.");return}
    grp.push(id)}
  mutate(r=>{if(grp.length)r.group=grp;else delete r.group});
}
function assignDraft(id){
  const k=tid(id);const ex=S.res[k];const n=placeName(k);
  if(ex&&ex.done){toast(n+" ist schon fertig. Erst dort „Bearbeiten“ tippen.");return}
  const d=S.draft;const m=ex?clone(ex):{items:{},name:"",note:""};m.items=m.items||{};
  for(const p in d.items)m.items[p]=(m.items[p]||0)+d.items[p];
  if(!(m.name||"").trim())m.name=d.name||"";
  if((d.note||"").trim())m.note=[m.note,d.note].filter(x=>(x||"").trim()).join(" / ");
  m.ts=Date.now();const had=ex&&!isEmpty(ex);
  S.res[k]=m;saveRes(k);S.draft=null;saveDraft();S.sel=id;S.confirmClear=false;
  if(floorOf(id)!==S.floor)S.floor=floorOf(id);
  renderAll();renderOrder(true);toast(had?"Zu "+n+" dazugebucht":"Bestellung an "+n);
  if(window.matchMedia("(max-width:979px)").matches)$("order").scrollIntoView({behavior:"smooth",block:"start"});
}
function onOrderClick(e){
  const t=e.target;
  if(S.sel==null){if(t.closest("[data-inc]")&&!S.editing){S.sel="D";S.confirmClear=false;if(!S.draft)S.draft={items:{},name:"",note:""};renderOrder(true)}else return}
  if(t.closest("#grpbtn")){S.grouping=!S.grouping;renderPlan();renderOrder(false);
    if(S.grouping&&window.matchMedia("(max-width:979px)").matches)$("assignbar").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.closest("#holdbtn")){mutate(r=>{r.hold=true});toast(selName()+" ist reserviert");return}
  if(t.closest("#oclose")){S.grouping=false;S.sel=null;S.confirmClear=false;renderAll();return}
  if(t.closest("#picktbl")){$("assignbar").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(!isD()&&getCur()&&getCur().done&&(t.closest("[data-inc]")||t.closest("[data-dec]")))return;
  const inc=t.closest("[data-inc]");if(inc){const k=inc.dataset.inc;mutate(r=>{r.items[k]=(r.items[k]||0)+1});return}
  const dec=t.closest("[data-dec]");if(dec){const k=dec.dataset.dec;mutate(r=>{r.items[k]=(r.items[k]||0)-1;if(r.items[k]<=0)delete r.items[k]});return}
  if(t.closest("#donebtn")){const n=selName();S.grouping=false;mutate(r=>{r.done=true});S.sel=null;S.confirmClear=false;renderAll();toast(n+" ist fertig");
    if(window.matchMedia("(max-width:979px)").matches)$("plan").scrollIntoView({behavior:"smooth",block:"center"});return}
  if(t.closest("#unlock")){mutate(r=>{r.done=false});renderOrder(true);return}
  if(t.closest("#clearask")){S.confirmClear=true;renderOrder(false);return}
  if(t.closest("#clearno")){S.confirmClear=false;renderOrder(false);return}
  if(t.closest("#clearyes")&&isD()){S.draft=null;saveDraft();S.sel=null;S.confirmClear=false;renderAll();toast("Bestellung verworfen");return}
  if(t.closest("#clearyes")){const id=tid(S.sel);delete S.res[id];S.confirmClear=false;saveRes(id);toast("Reservierung "+selName()+" gelöscht");renderAll();renderOrder(true);return}
}
$("order").addEventListener("click",onOrderClick);
$("picker").addEventListener("click",e=>{
  const c=e.target.closest("[data-cat]");if(c){S.cat=c.dataset.cat;renderPicker();return}
  onOrderClick(e);
});
$("assignbar").addEventListener("click",e=>{if(e.target.closest("#grpdone")){S.grouping=false;renderAll();return}if(e.target.closest("#draftresume")){S.sel="D";S.confirmClear=false;renderAll();renderOrder(true);
  if(window.matchMedia("(max-width:979px)").matches)$("order").scrollIntoView({behavior:"smooth",block:"start"})}});
let typeT=null;
$("order").addEventListener("input",e=>{
  const f=e.target.id==="gname"?"name":e.target.id==="gnote"?"note":null;if(!f)return;
  const k=curKey();const cur=getKey(k);const r=cur?clone(cur):{items:{},name:"",note:""};
  r[f]=e.target.value;r.ts=Date.now();if(k==="draft")S.draft=r;else S.res[k]=r;
  clearTimeout(typeT);typeT=setTimeout(()=>{putKey(k,getKey(k));renderSummary();renderPlan()},400);
});
let evT=null;
$("evname").addEventListener("input",e=>{S.event={name:e.target.value};clearTimeout(evT);evT=setTimeout(()=>saveDoc("config/event",S.event),500)});
$("kasse").addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("#resetask")){openReset();return}
  if(t.closest("#resetno")){S.confirmReset=false;renderKasse();return}
  if(t.closest("#resetyes")){
    const ids=Object.keys(S.res);S.res={};S.sel=null;S.confirmReset=false;renderAll();
    if(mode==="db"){for(const id of ids){try{await db.doc("res/"+id).delete()}catch(err){}}}else lsSave();
    toast("Alle Reservierungen gelöscht");
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("zonemodal").hidden){$("zonemodal").hidden=true;return}if(e.key==="Escape"&&!$("resetmodal").hidden){closeReset();return}if(e.key==="Escape"&&S.grouping){S.grouping=false;renderAll();return}if(e.key==="Escape"&&S.sel!=null){S.sel=null;renderAll()}});
/* ---------- Neue Veranstaltung ---------- */
function openReset(){
  const keys=Object.keys(S.res).filter(k=>!isEmpty(S.res[k]));let sum=0;keys.forEach(k=>sum+=total(S.res[k]));
  $("rmbox").innerHTML=`<h2 id="rm-title">Neue Veranstaltung starten?</h2>
    <p>${keys.length?`Willst du wirklich alle <b>${keys.length} Reservierung${keys.length===1?"":"en"}</b> (${eur(sum)}) entfernen?`:"Es sind gerade keine Reservierungen drin."} Die Abrechnung wird dabei auch geleert. Das lässt sich nicht rückgängig machen. Der Tischplan bleibt.</p>
    <div class="rm-btns"><span class="spacer"></span><button class="ghost" id="rm-cancel">Abbrechen</button><button class="btn-solid" id="rm-go">Ja, alles entfernen</button></div>`;
  $("resetmodal").hidden=false;setTimeout(()=>$("rm-cancel").focus(),30);
}
function closeReset(){$("resetmodal").hidden=true}
function openZone(z){
  if(S.grouping){toast("Erst „Fertig“ beim Zusammenstellen tippen.");return}
  if(isD()&&S.draft&&!isEmpty(S.draft)){assignDraft(nextSpot(z));return}
  const ks=zoneSpots(z);const nx=nextSpot(z);const nn=spotOf(nx).num;
  $("zmbox").innerHTML=`<h2>${ZONES[z].name}</h2><p>${ks.length?`${ks.length} ${ks.length===1?"Platz ist":"Plätze sind"} schon vergeben. Antippen zum Öffnen.`:"Hier ist noch nichts vergeben."}</p>
    ${ks.length?`<div class="zlist">${ks.map(k=>{const r=S.res[k];return `<button class="zitem${r.done?" done":""}" data-spot="${esc(k.slice(1))}"><b>${spotOf(k.slice(1)).num}</b><span>${esc(r.name||"")}${r.name?"<br>":""}<small>${count(r)?eur(total(r)):"ohne Bestellung"}${r.done?", fertig":""}</small></span></button>`}).join("")}</div>`:""}
    <button class="btn-solid" data-spot="${nx}">+ Neuer Platz: ${ZONES[z].name} ${nn}</button>
    <button class="ghost" id="zm-close">Schließen</button>`;
  $("zonemodal").hidden=false;
}
$("zonemodal").addEventListener("click",e=>{const t=e.target;if(t===$("zonemodal")||t.closest("#zm-close")){$("zonemodal").hidden=true;return}
  const b=t.closest("[data-spot]");if(!b)return;$("zonemodal").hidden=true;
  S.grouping=false;S.sel=b.dataset.spot;S.confirmClear=false;renderAll();renderOrder(true);
  if(window.matchMedia("(max-width:979px)").matches)$("order").scrollIntoView({behavior:"smooth",block:"start"});});
async function doReset(){
  const ids=Object.keys(S.res);S.res={};S.sel=null;S.draft=null;saveDraft();S.event={name:""};$("evname").value="";
  {const st=S.abr.start,tg=S.abr.target;S.abr=newAbr();S.abr.start=st;S.abr.target=tg;if(mode==="db")saveDoc("config/abr",S.abr)}
  closeReset();renderAll();
  if(mode==="db"){for(const id of ids){try{await db.doc("res/"+id).delete()}catch(err){}}saveDoc("config/event",S.event)}else lsSave();
  toast("Alle Reservierungen entfernt");
}
$("newevent").onclick=openReset;
$("resetmodal").addEventListener("click",e=>{const t=e.target;if(t===$("resetmodal")||t.closest("#rm-cancel")){closeReset();return}if(t.closest("#rm-go"))doReset()});

/* ---------- Suche ---------- */
$("psearch").addEventListener("input",e=>{S.q=e.target.value;renderPicker()});
$("psearch").addEventListener("keydown",e=>{if(e.key==="Escape"){e.stopPropagation();S.q="";e.target.value="";renderPicker()}});
$("psclear").onclick=()=>{S.q="";$("psearch").value="";renderPicker();$("psearch").focus()};
/* ---------- Hell / Dunkel ---------- */
function isDark(){const t=document.documentElement.getAttribute("data-theme");if(t)return t==="dark";return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches}
function setThemeLabel(){$("themetxt").textContent=isDark()?"Hell":"Dunkel"}
(function(){let t=null;try{t=localStorage.getItem("pausenres_theme")}catch(e){}if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);setThemeLabel()})();
$("themebtn").onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("pausenres_theme",t)}catch(e){}setThemeLabel()};
/* ---------- Start ---------- */
function setSync(on,txt){$("syncdot").classList.toggle("on",on);$("synctxt").textContent=txt}
lsLoad();if(S.abrLoaded){S.abr=Object.assign(newAbr(),S.abrLoaded);delete S.abrLoaded}loadDraft();setSync(false,"Gespeichert auf diesem Gerät");renderAll();
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const d=await window.claude.use("db");if(!d)return;
    db=d;mode="db";setSync(true,"Online gespeichert");
    db.collection("res").onSnapshot(snap=>{
      const next={};snap.docs.forEach(doc=>{if(doc.exists)next[doc.id]=clone(doc.data())});
      dirty.forEach(id=>{if(S.res[id])next[id]=S.res[id];else delete next[id]});
      S.res=next;renderAll();
    },()=>setSync(false,"Verbindung weg, bitte neu laden"));
    db.doc("config/layout").onSnapshot(snap=>{
      if(S.editing)return;
      if(snap.exists){const d=snap.data();if(d&&Array.isArray(d.tables)&&d.tables.length&&d.v===DEFAULT_LAYOUT.v)S.layout=normLayout(clone(d))}
      renderAll();
    },()=>{});
    db.doc("config/products").onSnapshot(snap=>{if(snap.exists){const d=snap.data();if(d&&Array.isArray(d.items)){S.custom=clone(d.items);buildProducts(S.custom);renderAll();if(S.addOpen)renderAddForm()}}},()=>{});
    db.doc("config/abr").onSnapshot(snap=>{if(snap.exists&&!abrT){const d=snap.data();if(d&&typeof d==="object"){const sub=S.abr.sub;S.abr=Object.assign(newAbr(),clone(d));S.abr.sub=sub;if(S.tab==="abr"&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#abr")))renderAbr()}}},()=>{});
    db.doc("config/event").onSnapshot(snap=>{if(snap.exists){S.event=clone(snap.data());renderSummary()}},()=>{});
  }catch(e){}
})();
})();
</script>
</body>
